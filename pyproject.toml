[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway across OpenAI, Anthropic & Gemini with cost + latency tracking"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.162.2",
    "httpx>=0.27",
    "litellm>=1.108.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.32.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
