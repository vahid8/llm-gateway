# Weekly dependency updates. Minor and patch bumps come as one grouped PR per
# ecosystem; major bumps come one PR each. Security fixes arrive at once,
# outside this schedule. Nothing merges on its own: the owner asks for it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    # Wait a week after a release before proposing it (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
